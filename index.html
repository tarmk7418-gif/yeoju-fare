<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="여주 배차·요금" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>여주시 기사 배차 & 길찾기 요금표</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --primary:#1d4ed8; --primary-dark:#1e3a8a; --primary-light:#eff6ff; --kakao-yellow:#fee500; --kakao-brown:#191919; --navi-bg:#0f172a; --navi-text:#fde047; --success:#059669; --danger:#dc2626; --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#475569; --border:#cbd5e1; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); padding-bottom:calc(28px + env(safe-area-inset-bottom)); }
    header { background:linear-gradient(135deg,var(--primary-dark),var(--primary)); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:1000; box-shadow:0 2px 8px rgba(0,0,0,0.16); }
    .header-inner { max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
    .header-title h1 { margin:0; font-size:1.08rem; }
    .header-title p { margin:2px 0 0; font-size:0.75rem; opacity:0.9; }
    .header-right { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .pill { font-size:0.74rem; font-weight:700; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,0.2); color:#fff; }
    .pill.live { background:#10b981; }
    .container { max-width:1100px; margin:12px auto; padding:0 12px; }
    .card { background:var(--card); border-radius:12px; border:1px solid #e2e8f0; box-shadow:0 2px 8px rgba(15,23,42,0.05); padding:15px; margin-bottom:12px; }
    button { font-family:inherit; cursor:pointer; border:none; border-radius:8px; font-weight:700; font-size:0.85rem; padding:9px 13px; display:inline-flex; align-items:center; justify-content:center; gap:5px; }
    button:active { transform:scale(0.98); }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-success { background:var(--success); color:#fff; }
    .btn-danger-outline { background:#fff; color:var(--danger); border:1px solid #fecaca; }
    .btn-warn { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
    .btn-kakao { background:var(--kakao-yellow); color:var(--kakao-brown); }
    .btn-navi { background:var(--navi-bg); color:var(--navi-text); }
    .btn-outline { background:#fff; color:var(--text); border:1px solid var(--border); }
    .btn-sm { padding:6px 10px; font-size:0.78rem; }
    input, select { width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:16px; background:#fff; outline:none; }
    input:focus, select:focus { border-color:var(--primary); }
    label { display:block; font-size:0.76rem; font-weight:700; color:var(--muted); margin-bottom:4px; }
    .login-box { max-width:420px; margin:36px auto; text-align:center; }
    .login-box h2 { margin:0 0 6px; font-size:1.25rem; }
    .login-box p { margin:0 0 18px; font-size:0.84rem; color:var(--muted); }
    .tab-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; background:#e2e8f0; padding:5px; border-radius:12px; margin-bottom:12px; position:sticky; top:56px; z-index:900; }
    .tab-btn { background:transparent; color:var(--muted); padding:9px 6px; border-radius:8px; font-size:0.82rem; }
    .tab-btn.active { background:#fff; color:var(--primary); box-shadow:0 1px 4px rgba(0,0,0,0.1); }
    .tab-badge { background:var(--danger); color:#fff; font-size:0.7rem; padding:1px 6px; border-radius:999px; margin-left:3px; }
    .dispatch-card { border:1.5px solid #cbd5e1; border-radius:12px; padding:14px; margin-bottom:10px; background:#fff; }
    .dispatch-card.forced { border-color:#f59e0b; background:#fffbeb; }
    .dc-top { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
    .tag-forced { background:#dc2626; color:#fff; font-size:0.72rem; font-weight:800; padding:3px 8px; border-radius:6px; }
    .tag-normal { background:#dbeafe; color:#1e40af; font-size:0.72rem; font-weight:800; padding:3px 8px; border-radius:6px; }
    .dc-route { font-size:0.94rem; font-weight:700; margin:6px 0; line-height:1.45; }
    .dc-wp { font-size:0.82rem; color:#b45309; font-weight:700; margin:3px 0; }
    .dc-meta { display:flex; flex-wrap:wrap; gap:10px; font-size:0.82rem; color:var(--muted); margin:8px 0; padding:8px; background:#f8fafc; border-radius:8px; }
    .dc-fare { font-size:1.05rem; font-weight:800; color:var(--primary); }
    .dc-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .dc-actions > * { flex:1; min-width:110px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .route-box { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:10px; margin-bottom:9px; position:relative; }
    .route-box.wp { background:#fffbeb; border-color:#fde68a; }
    .input-wrap { position:relative; margin-top:6px; }
    .input-row { display:grid; grid-template-columns:1fr auto auto; gap:5px; }
    .suggest-dropdown { position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1.5px solid #3b82f6; border-radius:10px; box-shadow:0 10px 24px rgba(0,0,0,0.16); max-height:250px; overflow-y:auto; z-index:1500; display:none; }
    .suggest-dropdown.open { display:block; }
    .suggest-item { padding:9px 11px; border-bottom:1px solid #f1f5f9; cursor:pointer; }
    .suggest-item:hover { background:var(--primary-light); }
    .suggest-title { font-weight:700; font-size:0.88rem; }
    .suggest-sub { font-size:0.74rem; color:var(--muted); }
    #map-wrapper { width:100%; height:270px; border-radius:10px; overflow:hidden; border:1px solid var(--border); margin:8px 0; }
    #kakao-map, #leaflet-map { width:100%; height:100%; }
    .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
    .stat-box { background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:8px; text-align:center; }
    .stat-box.hi { background:var(--primary-light); border-color:#93c5fd; }
    .stat-val { font-size:0.96rem; font-weight:800; }
    .stat-box.hi .stat-val { color:var(--primary); }
    table { width:100%; border-collapse:collapse; font-size:0.82rem; margin-top:8px; }
    th, td { padding:8px 6px; border-bottom:1px solid #e2e8f0; text-align:left; }
    th { background:#f8fafc; color:var(--muted); }
    #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(80px); background:#0f172a; color:#fff; padding:10px 18px; border-radius:999px; font-size:0.84rem; font-weight:700; z-index:9999; opacity:0; transition:all 0.25s; max-width:92vw; text-align:center; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    @media (max-width:760px) { .grid-2 { grid-template-columns:1fr; } .stat-grid { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-title">
        <h1>여주시 기사 배차 &amp; 요금표</h1>
        <p id="header-sub">고유 코드 로그인 후 실시간 배차 수신</p>
      </div>
      <div class="header-right" id="header-controls" style="display:none;">
        <span class="pill live" id="driver-badge">기사 로그인됨</span>
        <button type="button" class="btn-kakao btn-sm" id="btn-wakelock" onclick="APP.toggleWakeLock()">☀️ 화면켜짐 유지</button>
        <button type="button" class="btn-outline btn-sm" onclick="APP.logout()">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="login-view" class="card login-box">
      <h2>🚕 기사 고유 코드 로그인</h2>
      <p>관리자(상황실)에서 발급받은 본인 고유 코드를 입력하세요.</p>
      <div style="text-align:left; margin-bottom:12px;">
        <label for="login-code">기사 고유 코드</label>
        <input type="text" id="login-code" placeholder="예: 101" autocomplete="off" onkeydown="if(event.key==='Enter') APP.login()" />
      </div>
      <button type="button" class="btn-primary" style="width:100%; padding:12px;" onclick="APP.login()">로그인 및 배차 대기 시작</button>

      <div style="margin-top:16px; border-top:1px solid #e2e8f0; padding-top:12px; text-align:left;">
        <button type="button" class="btn-outline btn-sm" style="width:100%;" onclick="document.getElementById('sb-config-box').style.display = document.getElementById('sb-config-box').style.display === 'none' ? 'block' : 'none'">⚙️ 서버(Supabase) 연결 설정</button>
        <div id="sb-config-box" style="display:none; margin-top:10px;">
          <label>Supabase Project URL</label>
          <input type="text" id="cfg-sb-url" style="margin-bottom:8px;" />
          <label>Supabase Publishable Key</label>
          <input type="password" id="cfg-sb-key" placeholder="sb_publishable_..." style="margin-bottom:8px;" />
          <button type="button" class="btn-success btn-sm" style="width:100%;" onclick="APP.saveSupabaseConfig()">연결 정보 저장</button>
        </div>
      </div>
    </section>

    <div id="main-view" style="display:none;">
      <div class="tab-bar">
        <button type="button" class="tab-btn active" id="tab-btn-waiting" onclick="APP.switchTab('waiting')">📢 배차 대기 <span class="tab-badge" id="cnt-waiting">0</span></button>
        <button type="button" class="tab-btn" id="tab-btn-active" onclick="APP.switchTab('active')">🚕 진행중 <span class="tab-badge" id="cnt-active">0</span></button>
        <button type="button" class="tab-btn" id="tab-btn-done" onclick="APP.switchTab('done')">✅ 완료 내역</button>
        <button type="button" class="tab-btn" id="tab-btn-calc" onclick="APP.switchTab('calc')">🧮 요금 계산기</button>
      </div>

      <section id="tab-waiting">
        <div class="card" style="padding:11px 14px; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.84rem; font-weight:700;">원하는 콜을 선택해 [배차 잡기]를 누르세요.</span>
          <button type="button" class="btn-outline btn-sm" onclick="DISPATCH.loadAll()">🔄 새로고침</button>
        </div>
        <div id="list-waiting"></div>
      </section>

      <section id="tab-active" style="display:none;">
        <div id="list-active"></div>
      </section>

      <section id="tab-done" style="display:none;">
        <div class="card" id="done-summary" style="font-weight:700; font-size:0.9rem;"></div>
        <div id="list-done"></div>
      </section>

      <section id="tab-calc" style="display:none;">
        <div class="grid-2">
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:6px; flex-wrap:wrap;">
              <strong style="font-size:0.95rem;">📍 출발지 · 경유지 · 도착지</strong>
              <div style="display:flex; gap:5px;">
                <button type="button" class="btn-warn btn-sm" onclick="CALC.addWaypoint()">➕ 경유지</button>
                <button type="button" class="btn-outline btn-sm" onclick="CALC.swapPoints()">⇅ 반전</button>
              </div>
            </div>

            <div class="route-box">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                <span style="font-weight:800; color:#1e40af; font-size:0.82rem;">출발지</span>
                <div style="display:flex; gap:4px;">
                  <button type="button" class="btn-outline btn-sm" onclick="CALC.useCurrentLocation('origin')">📍 현위치</button>
                  <select id="preset-origin" style="width:auto; padding:4px 6px; font-size:13px;" onchange="CALC.selectPreset('origin', this.value)"></select>
                </div>
              </div>
              <div class="input-wrap">
                <div class="input-row">
                  <input type="text" id="input-origin" placeholder="건물명, 도로명, 지번 입력" oninput="AC.onInput('origin', this.value)" onblur="AC.scheduleClose('origin')" />
                  <button type="button" class="btn-outline btn-sm" onclick="AC.clear('origin')">✕</button>
                  <button type="button" class="btn-primary btn-sm" onclick="CALC.searchPoint('origin')">검색</button>
                </div>
                <div id="suggest-origin" class="suggest-dropdown"></div>
              </div>
              <div id="origin-status" style="font-size:0.76rem; margin-top:5px;">확정: <strong>여주시청</strong></div>
            </div>

            <div id="waypoints-container"></div>

            <div class="route-box" style="margin-bottom:10px;">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                <span style="font-weight:800; color:#991b1b; font-size:0.82rem;">도착지</span>
                <div style="display:flex; gap:4px;">
                  <button type="button" class="btn-outline btn-sm" onclick="CALC.useCurrentLocation('dest')">📍 현위치</button>
                  <select id="preset-dest" style="width:auto; padding:4px 6px; font-size:13px;" onchange="CALC.selectPreset('dest', this.value)"></select>
                </div>
              </div>
              <div class="input-wrap">
                <div class="input-row">
                  <input type="text" id="input-dest" placeholder="건물명, 도로명, 지번 입력" oninput="AC.onInput('dest', this.value)" onblur="AC.scheduleClose('dest')" />
                  <button type="button" class="btn-outline btn-sm" onclick="AC.clear('dest')">✕</button>
                  <button type="button" class="btn-primary btn-sm" onclick="CALC.searchPoint('dest')">검색</button>
                </div>
                <div id="suggest-dest" class="suggest-dropdown"></div>
              </div>
              <div id="dest-status" style="font-size:0.76rem; margin-top:5px;">확정: <strong>여주역 (경강선)</strong></div>
            </div>

            <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:10px; margin-bottom:10px;">
              <label for="calc-cust-phone">📞 손님 전화번호 (카톡·문자 안내 포함용)</label>
              <div style="display:grid; grid-template-columns:1fr auto; gap:6px; margin-bottom:8px;">
                <input type="tel" id="calc-cust-phone" placeholder="010-0000-0000" oninput="CALC.formatPhone(this)" />
                <button type="button" class="btn-outline btn-sm" onclick="CALC.pastePhone()">📋 번호 붙여넣기</button>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                <button type="button" class="btn-kakao btn-sm" onclick="CALC.shareMessage()">💬 카톡/공유 전송</button>
                <button type="button" class="btn-primary btn-sm" onclick="CALC.sendSMS()">✉️ 문자(SMS) 보내기</button>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              <div><label>기본요금(원)</label><input type="number" id="cfg-base-fare" value="4000" step="100" onchange="CALC.renderSummary()" /></div>
              <div><label>기본 포함 거리(km)</label><input type="number" id="cfg-base-dist" value="2.0" step="0.1" onchange="CALC.renderSummary()" /></div>
              <div><label>초과 km당(원)</label><input type="number" id="cfg-rate-km" value="1000" step="100" onchange="CALC.renderSummary()" /></div>
              <div><label>통행료 직접입력(원)</label><input type="number" id="cfg-manual-toll" value="0" step="100" oninput="CALC.onManualToll(this.value)" /></div>
            </div>
          </div>

          <div class="card">
            <div style="display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px;">
              <button type="button" class="btn-outline btn-sm" onclick="MAP.setPickMode('origin')">📌 출발찍기</button>
              <button type="button" class="btn-outline btn-sm" onclick="MAP.setPickMode('dest')">📌 도착찍기</button>
              <button type="button" class="btn-kakao btn-sm" onclick="CALC.openKakaoMap()">카카오맵 ↗</button>
              <button type="button" class="btn-navi btn-sm" onclick="CALC.openKakaoNavi()">🧭 카카오내비 ↗</button>
            </div>
            <div id="map-wrapper">
              <div id="kakao-map" style="display:none;"></div>
              <div id="leaflet-map"></div>
            </div>
            <div class="stat-grid">
              <div class="stat-box"><div style="font-size:0.72rem;color:var(--muted);">주행거리</div><div class="stat-val" id="res-dist">-</div></div>
              <div class="stat-box"><div style="font-size:0.72rem;color:var(--muted);">초과요금</div><div class="stat-val" id="res-excess">-</div></div>
              <div class="stat-box"><div style="font-size:0.72rem;color:var(--muted);">통행료(천원올림)</div><div class="stat-val" id="res-toll">0원</div></div>
              <div class="stat-box hi"><div style="font-size:0.72rem;color:var(--muted);">최종요금</div><div class="stat-val" id="res-total">-</div></div>
            </div>
            <button type="button" class="btn-success" style="width:100%; margin-top:10px;" onclick="CALC.addToLocalTable()">➕ 아래 개인 요금표에 추가</button>
          </div>
        </div>

        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
            <strong>📋 개인 누적 요금표 (<span id="local-cnt">0</span>건)</strong>
            <div style="display:flex; gap:5px;">
              <button type="button" class="btn-outline btn-sm" onclick="CALC.exportCSV()">📥 CSV 저장</button>
              <button type="button" class="btn-danger-outline btn-sm" onclick="CALC.clearTable()">전체 삭제</button>
            </div>
          </div>
          <div style="overflow-x:auto;">
            <table>
              <thead><tr><th>출발지</th><th>경유지</th><th>도착지</th><th>거리</th><th>통행료</th><th>최종요금</th><th>삭제</th></tr></thead>
              <tbody id="local-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    const CONFIG = {
      KAKAO_JS_KEY: '348aec403735e7af2a661c30ce11e8e5',
      KAKAO_REST_KEY: '8753d03a528d0664dfdaaca2a11ce75e',
      SUPABASE_URL: 'https://uoayezajeeadhmofgfrd.supabase.co',
      SUPABASE_ANON_KEY: '여기에_복사한_sb_publishable_전체키_붙여넣기',
      YEOJU_CENTER: { lat: 37.298344, lng: 127.637518 }
    };

    const YEOJU_PRESETS = [
      { id: 'cityhall', name: '여주시청', lat: 37.298344, lng: 127.637518 },
      { id: 'yeojustation', name: '여주역 (경강선)', lat: 37.282795, lng: 127.628571 },
      { id: 'sejongstation', name: '세종대왕릉역', lat: 37.293933, lng: 127.570728 },
      { id: 'terminal', name: '여주종합터미널', lat: 37.291642, lng: 127.637915 },
      { id: 'outlet', name: '여주프리미엄아울렛', lat: 37.243542, lng: 127.614828 },
      { id: 'emart', name: '이마트 여주점', lat: 37.292118, lng: 127.649122 },
      { id: 'silleuksa', name: '신륵사 관광지', lat: 37.299581, lng: 127.656241 },
      { id: 'yeojuic', name: '여주IC', lat: 37.260215, lng: 127.623812 },
      { id: 'ganam', name: '가남읍 행정복지센터', lat: 37.202298, lng: 127.543284 },
      { id: 'jeomdong', name: '점동면 행정복지센터', lat: 37.204556, lng: 127.674983 },
      { id: 'sejongmyeon', name: '세종대왕면 행정복지센터', lat: 37.295183, lng: 127.551672 },
      { id: 'heungcheon', name: '흥천면 행정복지센터', lat: 37.359624, lng: 127.525537 },
      { id: 'geumsa', name: '금사면 행정복지센터', lat: 37.397631, lng: 127.547198 },

    const APP = {

    const DISPATCH = {
      rows: [], channel: null,
      async init() {

          .on('postgres_changes', { event: '*', schema: 'public', table: 'yeoju_dispatches' }, (payload) => {
            const n = payload.new || {};
            if (payload.eventType === 'INSERT' && n.status === 'waiting') { beep(); toast(`📢 새 대기 배차 도착: ${n.origin_name} → ${n.dest_name}`); }
            else if (n.driver_code === APP.driver?.code && n.dispatch_type === 'forced' && n.status === 'accepted') { beep(); toast(`🚨 강제배차가 배정되었습니다! (${n.origin_name} → ${n.dest_name})`); APP.switchTab('active'); }

      async loadAll() {

      render() {

        document.getElementById('list-active').innerHTML = active.length ? active.map(r => this.cardHtml(r, 'active')).join('') : '<div class="card" style="text-align:center;color:var(--muted);padding:28px;">진행 중인 배차가 없습니다.</div>';
        const sumFare = done.reduce((acc, r) => acc + (r.total_fare || 0), 0);
        document.getElementById('done-summary').textContent = `총 완료: ${done.length}건 / 누적 요금 합계: ${sumFare.toLocaleString()}원`;
        document.getElementById('list-done').innerHTML = done.length ? done.map(r => this.cardHtml(r, 'done')).join('') : '<div class="card" style="text-align:center;color:var(--muted);padding:28px;">완료된 운행 내역이 없습니다.</div>';

      cardHtml(r, mode) {
        const wps = Array.isArray(r.waypoints) ? r.waypoints : [];

        const km = (r.distance_meters / 1000).toFixed(2);
        const timeStr = new Date(r.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

      async acceptCall(id) {

    const AC = {
      timers: {}, items: {},
      onInput(t, v) {

    const MAP = {
      mode: 'leaflet', pickMode: null, lMap: null, lItems: [], kMap: null, kItems: [],
      init() {

      setPickMode(t) { this.pickMode = t; toast('지도에서 위치를 터치하세요.'); },
      draw(o, wps, d, path) {
        const pts = [o, ...wps.filter(w => w.lat), d];
        if (this.mode === 'kakao' && this.kMap) {
          this.kItems.forEach(x => x.setMap(null)); this.kItems = [];
          const bounds = new window.kakao.maps.LatLngBounds();
          pts.forEach(p => { const pos = new window.kakao.maps.LatLng(p.lat, p.lng); this.kItems.push(new window.kakao.maps.Marker({ map: this.kMap, position: pos })); bounds.extend(pos); });
          const line = new window.kakao.maps.Polyline({ path: (path?.length ? path : pts.map(p=>[p.lat,p.lng])).map(c => new window.kakao.maps.LatLng(c[0], c[1])), strokeWeight: 5, strokeColor: '#1d4ed8', strokeOpacity: 0.85 });
          line.setMap(this.kMap); this.kItems.push(line); this.kMap.setBounds(bounds);
        } else if (this.lMap) {
          this.lItems.forEach(x => this.lMap.removeLayer(x)); this.lItems = [];
          pts.forEach(p => this.lItems.push(L.marker([p.lat, p.lng]).addTo(this.lMap)));
          const line = L.polyline(path?.length ? path : pts.map(p=>[p.lat,p.lng]), { color: '#1d4ed8', weight: 5 }).addTo(this.lMap);
          this.lItems.push(line); this.lMap.fitBounds(line.getBounds(), { padding: [25, 25] });
        }
      }
    };

    const CALC = {
      origin: { ...YEOJU_PRESETS[0] }, waypoints: [], dest: { ...YEOJU_PRESETS[1] }, route: null, localRows: [],
      async init() {
        ['preset-origin', 'preset-dest'].forEach(id => { document.getElementById(id).innerHTML = '<option value="">거점 선택...</option>' + YEOJU_PRESETS.map(p => `<option value="${p.id}">${p.name}</option>`).join(''); });
        this.localRows = JSON.parse(localStorage.getItem('yeoju_local_rows_v1') || '[]');
        this.renderLocalTable();
        const s = document.createElement('script');
        s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_JS_KEY}&libraries=services&autoload=false`;
        s.onload = () => MAP.init(); s.onerror = () => MAP.init();
        document.head.appendChild(s);
        await this.calcRoute();
      },
      async searchPlaces(q) {
        const res = [];
        try {
          const headers = { Authorization: `KakaoAK ${CONFIG.KAKAO_REST_KEY}` };
          const [kr, ar] = await Promise.allSettled([
            fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(q)}&x=127.637518&y=37.298344&size=10`, { headers }),
            fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(q)}&size=5`, { headers })
          ]);
          if (kr.status === 'fulfilled' && kr.value.ok) { (await kr.value.json()).documents?.forEach(d => res.push({ name: d.place_name, roadAddr: d.road_address_name, jibunAddr: d.address_name, lat: parseFloat(d.y), lng: parseFloat(d.x) })); }
          if (ar.status === 'fulfilled' && ar.value.ok) { (await ar.value.json()).documents?.forEach(d => res.push({ name: d.road_address?.address_name || d.address?.address_name, roadAddr: d.road_address?.address_name, jibunAddr: d.address?.address_name, lat: parseFloat(d.y), lng: parseFloat(d.x) })); }
        } catch {}
        return res;
      },
      addWaypoint() { if (this.waypoints.length >= 5) return toast('경유지는 최대 5곳까지 가능합니다.'); this.waypoints.push({ name: '', lat: null, lng: null }); this.renderWaypoints(); },
      removeWaypoint(i) { this.waypoints.splice(i, 1); this.renderWaypoints(); this.calcRoute(); },
      renderWaypoints() {
        document.getElementById('waypoints-container').innerHTML = this.waypoints.map((w, i) => `
          <div class="route-box wp"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-weight:800;color:#92400e;font-size:0.8rem;">경유 ${i+1}</span><button type="button" class="btn-danger-outline btn-sm" onclick="CALC.removeWaypoint(${i})">삭제</button></div>
          <div class="input-wrap"><div class="input-row"><input type="text" id="input-wp-${i}" value="${esc(w.name)}" placeholder="경유지 건물명·주소" oninput="AC.onInput('wp-${i}', this.value)" onblur="AC.scheduleClose('wp-${i}')" /><button type="button" class="btn-outline btn-sm" onclick="AC.clear('wp-${i}')">✕</button><button type="button" class="btn-primary btn-sm" onclick="CALC.searchPoint('wp-${i}')">검색</button></div><div id="suggest-wp-${i}" class="suggest-dropdown"></div></div></div>`).join('');
      },
      setPoint(t, pt) {
        if (t === 'origin' || t === 'dest') { this[t] = pt; document.getElementById(`input-${t}`).value = pt.name; document.getElementById(`${t}-status`).innerHTML = `확정: <strong>${esc(pt.name)}</strong>`; }
        else if (t.startsWith('wp-')) { this.waypoints[Number(t.split('-')[1])] = pt; this.renderWaypoints(); }
        this.calcRoute();
      },
      selectPreset(t, id) { const f = YEOJU_PRESETS.find(p => p.id === id); if (f) this.setPoint(t, { ...f }); },
      async searchPoint(t) { const q = document.getElementById(`input-${t}`)?.value.trim(); if (!q) return; const list = await this.searchPlaces(q); if (list.length) this.setPoint(t, list[0]); else toast('검색 결과가 없습니다.'); },
      async setCoord(t, lat, lng) {
        try {
          const r = await fetch(`https://dapi.kakao.com/v2/local/geo/coord2address.json?x=${lng}&y=${lat}`, { headers: { Authorization: `KakaoAK ${CONFIG.KAKAO_REST_KEY}` } });
          const doc = (await r.json()).documents?.[0];
          this.setPoint(t, { name: doc?.road_address?.address_name || doc?.address?.address_name || `좌표(${lat.toFixed(4)},${lng.toFixed(4)})`, lat, lng });
        } catch { this.setPoint(t, { name: `좌표(${lat.toFixed(4)},${lng.toFixed(4)})`, lat, lng }); }
      },
      useCurrentLocation(t) { navigator.geolocation?.getCurrentPosition(p => this.setCoord(t, p.coords.latitude, p.coords.longitude)); },
      swapPoints() {
        [this.origin, this.dest] = [this.dest, this.origin]; this.waypoints.reverse();
        document.getElementById('input-origin').value = this.origin.name; document.getElementById('input-dest').value = this.dest.name;
        document.getElementById('origin-status').innerHTML = `확정: <strong>${esc(this.origin.name)}</strong>`;
        document.getElementById('dest-status').innerHTML = `확정: <strong>${esc(this.dest.name)}</strong>`;
        this.renderWaypoints(); this.calcRoute();
      },
      async calcRoute() {
        const wps = this.waypoints.filter(w => typeof w.lat === 'number');
        try {
          let url = `https://apis-navi.kakaomobility.com/v1/directions?origin=${this.origin.lng},${this.origin.lat}&destination=${this.dest.lng},${this.dest.lat}&priority=RECOMMEND`;
          if (wps.length) url += `&waypoints=${encodeURIComponent(wps.map(w => `${w.lng},${w.lat}`).join('|'))}`;
          const rt = (await (await fetch(url, { headers: { Authorization: `KakaoAK ${CONFIG.KAKAO_REST_KEY}` } })).json()).routes?.[0];
          if (rt && rt.result_code === 0) {
            const path = [];
            (rt.sections || []).forEach(s => (s.roads || []).forEach(rd => { for (let i = 0; i < (rd.vertexes || []).length; i += 2) path.push([rd.vertexes[i+1], rd.vertexes[i]]); }));
            this.route = { dist: rt.summary.distance, dur: rt.summary.duration, toll: rt.summary.fare?.toll || 0, path };
            document.getElementById('cfg-manual-toll').value = this.route.toll;
            MAP.draw(this.origin, wps, this.dest, path);
            this.renderSummary();
            return;
          }
        } catch {}
        const pts = [this.origin, ...wps, this.dest];
        const oRt = (await (await fetch(`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>`${p.lng},${p.lat}`).join(';')}?overview=full&geometries=geojson`)).json()).routes?.[0];
        if (oRt) {
          this.route = { dist: Math.round(oRt.distance), dur: Math.round(oRt.duration), toll: 0, path: oRt.geometry.coordinates.map(c=>[c[1],c[0]]) };
          MAP.draw(this.origin, wps, this.dest, this.route.path);
          this.renderSummary();
        }
      },
      onManualToll(v) { if (this.route) { this.route.toll = Math.max(0, Number(v) || 0); this.renderSummary(); } },
      getFareInfo() {
        if (!this.route) return null;
        const baseFare = Number(document.getElementById('cfg-base-fare').value) || 0, baseDist = Number(document.getElementById('cfg-base-dist').value) || 0, rate = Number(document.getElementById('cfg-rate-km').value) || 0;
        const km = this.route.dist / 1000, excess = Math.floor(Math.max(0, km - baseDist) * rate / 1000) * 1000, toll = this.route.toll > 0 ? Math.ceil(this.route.toll / 1000) * 1000 : 0;
        return { km, baseFare, excess, toll, total: baseFare + excess + toll };
      },
      renderSummary() {
        const f = this.getFareInfo(); if (!f) return;
        document.getElementById('res-dist').textContent = `${f.km.toFixed(2)} km`;
        document.getElementById('res-excess').textContent = `${f.excess.toLocaleString()}원`;
        document.getElementById('res-toll').textContent = `${f.toll.toLocaleString()}원`;
        document.getElementById('res-total').textContent = `${f.total.toLocaleString()}원`;
      },
      formatPhone(el) {
        const d = el.value.replace(/\D/g, '').slice(0, 11);
        el.value = d.length > 7 ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}` : (d.length > 3 ? `${d.slice(0,3)}-${d.slice(3)}` : d);
      },
      async pastePhone() {
        try {
          const m = (await navigator.clipboard.readText()).match(/01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/);
          if (m) { const el = document.getElementById('calc-cust-phone'); el.value = m[0]; this.formatPhone(el); toast(`번호 입력됨: ${el.value}`); }
          else toast('클립보드에 휴대폰 번호가 없습니다.');
        } catch { toast('붙여넣기 권한을 허용하거나 입력칸을 길게 눌러 붙여넣으세요.'); }
      },
      buildShareText() {
        const f = this.getFareInfo(), phone = document.getElementById('calc-cust-phone').value.trim(), wps = this.waypoints.filter(w => typeof w.lat === 'number');
        return `[여주시 요금 및 경로 안내]\n출발: ${this.origin.name}${wps.length ? `\n경유: ${wps.map(w=>w.name).join(' → ')}` : ''}\n도착: ${this.dest.name}\n거리: ${f ? f.km.toFixed(2) : 0}km\n통행료: ${f ? f.toll.toLocaleString() : 0}원\n최종요금: ${f ? f.total.toLocaleString() : 0}원${phone ? `\n손님연락처: ${phone}` : ''}\n길찾기: ${this.buildMapUrl(this.origin, wps, this.dest)}`;
      },
      async shareMessage() {
        const text = this.buildShareText();
        if (navigator.share) { try { await navigator.share({ title: '여주시 배차 안내', text }); } catch {} }
        else { await navigator.clipboard.writeText(text); toast('안내 문구가 복사되었습니다. 카톡에 붙여넣으세요.'); }
      },
      sendSMS() { location.href = `sms:${/iPhone|iPad|iPod/i.test(navigator.userAgent) ? '&' : '?'}body=${encodeURIComponent(this.buildShareText())}`; },
      buildMapUrl(o, wps, d) {
        let u = `https://map.kakao.com/link/from/${encodeURIComponent(o.name)},${o.lat},${o.lng}`;
        (wps || []).forEach(w => { if (w.lat) u += `/by/${encodeURIComponent(w.name)},${w.lat},${w.lng}`; });
        return `${u}/to/${encodeURIComponent(d.name)},${d.lat},${d.lng}`;
      },
      openKakaoMap() { window.open(this.buildMapUrl(this.origin, this.waypoints, this.dest), '_blank', 'noopener'); },
      launchNavi(o, wps, d) {
        if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) { toast('PC에서는 카카오맵 길찾기로 연결됩니다.'); return window.open(this.buildMapUrl(o, wps, d), '_blank', 'noopener'); }
        const validWps = (wps || []).filter(w => typeof w.lat === 'number').slice(0, 3);
        const opt = { name: String(d.name), x: Number(d.lng), y: Number(d.lat), coordType: 'wgs84' };
        if (validWps.length) opt.viaPoints = validWps.map(w => ({ name: String(w.name), x: Number(w.lng), y: Number(w.lat) }));
        try { window.Kakao.Navi.start(opt); } catch { toast('카카오내비 실행 오류'); }
      },
      openKakaoNavi() { this.launchNavi(this.origin, this.waypoints, this.dest); },
      addToLocalTable() {
        const f = this.getFareInfo(); if (!f) return;
        this.localRows.push({ o: this.origin.name, wp: this.waypoints.filter(w => w.lat).map(w => w.name).join(' → ') || '-', d: this.dest.name, km: f.km.toFixed(2), toll: f.toll, total: f.total });
        localStorage.setItem('yeoju_local_rows_v1', JSON.stringify(this.localRows));
        this.renderLocalTable(); toast('개인 요금표에 추가되었습니다.');
      },
      renderLocalTable() {
        document.getElementById('local-cnt').textContent = this.localRows.length;
        document.getElementById('local-table-body').innerHTML = this.localRows.map((r, i) => `<tr><td>${esc(r.o)}</td><td>${esc(r.wp)}</td><td>${esc(r.d)}</td><td>${r.km}km</td><td>${r.toll.toLocaleString()}원</td><td><strong>${r.total.toLocaleString()}원</strong></td><td><button type="button" class="btn-danger-outline btn-sm" onclick="CALC.delRow(${i})">삭제</button></td></tr>`).join('');
      },
      delRow(i) { this.localRows.splice(i, 1); localStorage.setItem('yeoju_local_rows_v1', '[]'); localStorage.setItem('yeoju_local_rows_v1', JSON.stringify(this.localRows)); this.renderLocalTable(); },
      clearTable() { this.localRows = []; localStorage.setItem('yeoju_local_rows_v1', '[]'); this.renderLocalTable(); },
      exportCSV() {
        if (!this.localRows.length) return toast('데이터가 없습니다.');
        const csv = ['출발지,경유지,도착지,거리(km),통행료,최종요금', ...this.localRows.map(r => `"${r.o}","${r.wp}","${r.d}",${r.km},${r.toll},${r.total}`)].join('\n');
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' })); a.download = '여주_개인요금표.csv'; a.click();
      }
    };

    window.addEventListener('DOMContentLoaded', () => APP.init());
  </script>
